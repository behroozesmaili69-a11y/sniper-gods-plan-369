<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>SNIPER GOD'S PLAN 3.6.9</title>

<style>
*{
    box-sizing:border-box;
}

:root{
    --bg:#070a0f;
    --panel:#0d131c;
    --panel2:#111923;
    --border:#263241;
    --text:#f3f4f6;
    --muted:#8d9aaa;
    --green:#22c55e;
    --red:#ef4444;
    --yellow:#eab308;
    --blue:#38bdf8;
    --orange:#f97316;
}

body{
    margin:0;
    background:
        radial-gradient(circle at top,#111b29 0,#070a0f 45%);
    color:var(--text);
    font-family:
        Tahoma,
        Arial,
        sans-serif;
}

.app{
    width:min(920px,94%);
    margin:25px auto 50px;
}

.header{
    text-align:center;
    background:linear-gradient(145deg,#101923,#0a0f16);
    border:1px solid var(--border);
    border-radius:22px;
    padding:25px 18px;
    box-shadow:0 15px 45px rgba(0,0,0,.35);
}

.logo{
    font-size:34px;
    margin-bottom:8px;
}

.title{
    font-size:26px;
    font-weight:800;
}

.subtitle{
    margin-top:8px;
    color:var(--muted);
    line-height:1.7;
}

.panel{
    margin-top:18px;
    background:rgba(13,19,28,.96);
    border:1px solid var(--border);
    border-radius:20px;
    padding:22px;
}

.mode-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:16px;
    margin-top:22px;
}

.mode-card{
    min-height:180px;
    border:1px solid var(--border);
    border-radius:18px;
    background:linear-gradient(145deg,#111923,#0a0f16);
    color:white;
    cursor:pointer;
    padding:22px;
    transition:.2s;
}

.mode-card:hover{
    transform:translateY(-3px);
    border-color:#526173;
}

.mode-icon{
    font-size:42px;
}

.mode-name{
    font-size:21px;
    font-weight:800;
    margin-top:14px;
}

.mode-desc{
    color:var(--muted);
    margin-top:10px;
    line-height:1.7;
}

.progress{
    display:flex;
    gap:6px;
    overflow:hidden;
    margin-bottom:15px;
}

.progress span{
    height:4px;
    min-width:20px;
    flex:1;
    background:#1d2733;
    border-radius:10px;
}

.progress span.active{
    background:#64748b;
}

.mode-badge{
    display:inline-block;
    padding:7px 11px;
    border-radius:9px;
    background:#172131;
    color:#dbeafe;
    font-size:13px;
    margin-bottom:13px;
}

.question h2{
    margin:0 0 10px;
    font-size:21px;
}

.question-text{
    color:#aeb9c7;
    line-height:1.9;
    margin-bottom:18px;
}

.answers{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:11px;
}

button{
    font-family:inherit;
}

.answer{
    min-height:58px;
    padding:13px 14px;
    border-radius:13px;
    border:1px solid #2b3747;
    background:#111923;
    color:#f8fafc;
    cursor:pointer;
    font-size:15px;
    transition:.18s;
}

.answer:hover{
    background:#182331;
    border-color:#566579;
    transform:translateY(-1px);
}

.answer.green{
    border-color:#166534;
}

.answer.red{
    border-color:#7f1d1d;
}

.answer.yellow{
    border-color:#854d0e;
}

.answer.blue{
    border-color:#075985;
}

.footer-actions{
    display:flex;
    gap:10px;
    margin-top:18px;
}

.back,
.reset{
    flex:1;
    min-height:48px;
    border-radius:12px;
    border:1px solid #293646;
    background:#0b1119;
    color:#aeb9c7;
    cursor:pointer;
}

.back:hover,
.reset:hover{
    background:#151e2a;
}

.result{
    text-align:center;
    padding:25px 15px;
}

.result-icon{
    font-size:45px;
}

.result-title{
    font-size:24px;
    font-weight:800;
    margin-top:12px;
}

.result.green .result-title{
    color:var(--green);
}

.result.yellow .result-title{
    color:var(--yellow);
}

.result.red .result-title{
    color:var(--red);
}

.result-info{
    color:#aeb9c7;
    line-height:2;
    margin:15px auto;
    max-width:650px;
}

.checklist{
    text-align:right;
    background:#090e15;
    border:1px solid #202b39;
    border-radius:14px;
    padding:15px;
    line-height:2;
    color:#cbd5e1;
}

.small-note{
    color:#778597;
    font-size:12px;
    line-height:1.8;
    margin-top:12px;
}

@media(max-width:680px){
    .mode-grid,
    .answers{
        grid-template-columns:1fr;
    }

    .title{
        font-size:22px;
    }

    .panel{
        padding:17px;
    }
}
</style>
</head>

<body>

<div class="app">

<header class="header">
    <div class="logo">🦅</div>
    <div class="title">SNIPER GOD'S PLAN</div>
    <div class="subtitle">
        V3.6.9 + V5 SUPER SCALP<br>
        MASTER TRADING ASSISTANT
    </div>
</header>

<div id="app"></div>

</div>


<script>

/* =========================================================
   SNIPER GOD'S PLAN
   V3.6.9 + V5 SUPER SCALP
   MASTER ASSISTANT
========================================================= */


/* =========================================================
   GLOBAL STATE
========================================================= */

const MAX_DAILY_TRADES = 3;
const MAX_CONSECUTIVE_LOSSES = 2;

let mode = null;
let currentStep = 0;
let history = [];
let state = {};


/* =========================================================
   MODE SELECTOR
========================================================= */

function showModeSelector(){

    mode = null;
    currentStep = 0;
    history = [];
    state = {};

    document.getElementById("app").innerHTML = `

        <section class="panel">

            <div class="question">

                <h2>
                    ابتدا نوع معامله را انتخاب کن
                </h2>

                <div class="question-text">
                    می‌خواهی امروز از کدام موتور SNIPER GOD'S PLAN
                    استفاده کنی؟
                </div>

                <div class="mode-grid">

                    <button
                        class="mode-card"
                        onclick="startV5()">

                        <div class="mode-icon">⚡</div>

                        <div class="mode-name">
                            SUPER SCALP
                        </div>

                        <div class="mode-desc">
                            V5 LIVE MODE<br>
                            تصمیم‌گیری سریع در لحظه
                        </div>

                    </button>


                    <button
                        class="mode-card"
                        onclick="startV369()">

                        <div class="mode-icon">🦅</div>

                        <div class="mode-name">

                        </div>

                        <div class="mode-desc">

                        </div>

                    </button>

                </div>

            </div>

        </section>
    `;
}


/* =========================================================
   START MODES
========================================================= */

function startV5(){

    mode = "V5";
    currentStep = 0;
    history = [];
    state = {};

    renderV5();
}


function startV369(){

    mode = "V369";
    currentStep = 0;
    history = [];
    state = {};

    renderV369();
}


/* =========================================================
   COMMON RENDER
========================================================= */

function renderQuestion(
    modeName,
    stepNumber,
    totalSteps,
    title,
    text,
    answers
){

    let bars = "";

    for(let i=0;i<totalSteps;i++){

        bars += `
            <span class="${i <= stepNumber ? "active":""}"></span>
        `;
    }


    let html = `

        <section class="panel">

            <div class="mode-badge">
                ${modeName}
            </div>

            <div class="progress">
                ${bars}
            </div>

            <div class="question">

                <h2>${title}</h2>

                <div class="question-text">
                    ${text}
                </div>

                <div class="answers">
    `;


    answers.forEach(answer => {

        html += `
            <button
                class="answer ${answer.class || ""}"
                onclick="${answer.action}">
                ${answer.text}
            </button>
        `;

    });


    html += `

                </div>

                <div class="footer-actions">

                    <button
                        class="back"
                        onclick="goBack()">
                        ← Back
                    </button>

                    <button
                        class="reset"
                        onclick="showModeSelector()">
                        تغییر Mode
                    </button>

                </div>

            </div>

        </section>
    `;


    document.getElementById("app").innerHTML = html;
}

========================================================= */

/* =========================================================
   V5 ACTIONS
========================================================= */

function v5Daily(value){

    state.trades=value;
    nextStep();

}


function v5Loss(value){

    state.consecutiveLoss=value;
    nextStep();

}


function v5M15(value){

    state.m15=value;
    nextStep();

}


function v5Location(value){

    state.location=value;
    nextStep();

}


function v5Liquidity(value){

    state.liquidity=value;
    nextStep();

}


function v5Setup(value){

    state.setup=value;
    nextStep();

}


function v5Trigger(value){

    state.trigger=value;
    nextStep();

}


function v5FinalGate(){

    state.risk=true;
    state.sl=true;
    state.tp=true;
    state.targetSpace=true;

    finalEntry(
        "⚡ V5 SUPER SCALP ENTRY READY",
        "V5 Live Entry Gate کامل شده است."
    );
}

/* =========================================================
   V3.6.9 ACTIONS
========================================================= */

function dTrades(v){
    state.trades=v;
    nextStep();
}


function dLoss(v){
    state.loss=v;
    nextStep();
}


function dMonthly(v){
    state.monthly=v;
    nextStep();
}


function dWeekly(v){
    state.weekly=v;
    nextStep();
}


function dDaily(v){
    state.daily=v;
    nextStep();
}


function dH4(v){
    state.h4=v;
    nextStep();
}


function dH1(v){

    state.h1=v;

    /*
       Alignment:
       Counter-Trend step still exists in Draft 3.
       User decides whether it is active.
    */

    nextStep();
}


function dCounter(v){

    state.counter=v;

    if(v==="TOUCH 1"){

        finalWait(
            "🟡 WAIT — TOUCH #1",
            "Touch #1 فقط Context است. ورود ممنوع."
        );

        return;
    }

    nextStep();
}


function dLiquidity(v){
    state.liquidity=v;
    nextStep();
}


function dHTFReaction(v){
    state.htfReaction=v;
    nextStep();
}


function dLocation(v){
    state.location=v;
    nextStep();
}


function dM15(v){
    state.m15=v;
    nextStep();
}


function dM5(v){
    state.m5=v;
    nextStep();
}


function dM1(v){

    state.m1=v;

    /*
       Final Gate.
       Draft 3 requires:
       Context
       Location
       Liquidity
       HTF Reaction
       M15 Confirmation
       M5 Structure
       M1 Trigger
       Risk
       SL
       Target Space
    */

    finalEntry(
        "🦅 V3.6.9 ENTRY READY",
        "V3.6.9 Entry Gate کامل شده است."
    );
}


/* =========================================================
   NAVIGATION
========================================================= */

function nextStep(){

    history.push(currentStep);

    currentStep++;

    if(mode==="V5"){
        renderV5();
    }

    else if(mode==="V369"){
        renderV369();
    }
}


function goBack(){

    if(history.length===0){

        showModeSelector();

        return;
    }

    currentStep=history.pop();

    if(mode==="V5"){
        renderV5();
    }

    else if(mode==="V369"){
        renderV369();
    }
}
