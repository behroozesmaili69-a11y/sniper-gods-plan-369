/* =========================================================

   ========================================================= */

function answer(value){

    const steps = getSteps();

    const step = steps[current];

    answers[step.id] = value;

    history.push(current);


    /* HARD STOPS */


    if(step.id==="trades" && value==="closed"){

        return finalState(
            "🔴",
            "NO TRADE",
            "3 Trades Completed",
            "Trading Day Closed — هیچ موتور دیگری اجازه Entry ندارد."
        );

    }


    if(step.id==="risk" && value==="stop"){

        return finalState(
            "🔴",
            "NO TRADE",
            "2 Consecutive Losses",
            "STOP FOR THE DAY — هر دو موتور متوقف هستند."
        );

    }


    if(step.id==="h4" && value==="transition"){

        return finalState(
            "🔴",
            "NO TRADE",
            "H4 TRANSITION",
            "Context جدید هنوز تأیید نشده است."
        );

    }


    if(step.id==="h1" && value==="unclear"){

        return finalState(
            "🔴",
            "NO TRADE",
            "H1 STRUCTURE UNCLEAR",
            "Context کافی برای ادامه وجود ندارد."
        );

    }


    if(step.id==="liquidity" && value==="unclear"){

        return finalState(
            "🔴",
            "NO TRADE",
            "LIQUIDITY UNCLEAR",
            "Liquidity Map قابل اعتماد نیست."
        );

    }


    if(step.id==="pool" && value==="pending"){

        return finalState(
            "🟡",
            "WAIT — HTF LIQUIDITY REACTION PENDING",
            "NO ENTRY",
            "تا Break & Acceptance یا Sweep & Reversal مشخص نشود Entry ممنوع است."
        );

    }


    if(
        step.id==="reaction" &&
        (value==="pending" || value==="invalid")
    ){

        return finalState(
            value==="pending" ? "🟡":"🔴",
            value==="pending"
                ? "WAIT — HTF LIQUIDITY REACTION PENDING"
                : "NO TRADE",
            "HTF LIQUIDITY REACTION",
            "Liquidity هنوز تعیین تکلیف نشده است."
        );

    }


    if(
        step.id==="location" &&
        (value==="middle" || value==="weak")
    ){

        return finalState(
            "🔴",
            "NO TRADE",
            "BAD LOCATION",
            "Range Middle / EQ یا Location ضعیف."
        );

    }


    if(
        step.id==="reclaim" &&
        (value==="incomplete" || value==="wick")
    ){

        return finalState(
            "🟡",
            "WAIT — RECLAIM INCOMPLETE",
            "WICK ≠ RECLAIM",
            "Reclaim معتبر نیازمند Valid Close و Hold / Reaction است."
        );

    }


    if(step.id==="ctl" && value==="invalid"){

        return finalState(
            "🔴",
            "NO TRADE",
            "INVALID COUNTER-TREND",
            "Counter-Trend شرایط لازم را ندارد."
        );

    }


    /* DEVELOPING STATES */

    if(
        (step.id==="setup" ||
         step.id==="m15" ||
         step.id==="m5" ||
         step.id==="m1")
        &&
        (value==="developing" ||
         value==="wait")
    ){

        return finalState(
            "🟡",
            "WAIT — SETUP DEVELOPING",
            mode==="day"
                ? "V3.6.9"
                : "V5 SUPER SCALP",
            "Setup هنوز کامل نشده است. Assistant هیچ مرحله‌ای را جعل نمی‌کند."
        );

    }


    /* INVALID ENGINE */

    if(
        step.id==="setup" &&
        value==="no"
    ){

        return finalState(
            "🔴",
            "NO TRADE",
            mode==="day"
                ? "NO V3.6.9 SETUP"
                : "NO V5 OPPORTUNITY",
            "Opportunity معتبر وجود ندارد."
        );

    }


    if(
        step.id==="m15" &&
        value==="fail"
    ){

        return finalState(
            "🔴",
            "NO TRADE",
            "M15 CONFIRMATION INVALID",
            "Confirmation معتبر نیست."
        );

    }


    if(
        step.id==="m5" &&
        value==="fail"
    ){

        return finalState(
            "🔴",
            "NO TRADE",
            "M5 STRUCTURE INVALID",
            "ساختار قابل معامله شکل نگرفته است."
        );

    }


    if(
        step.id==="m1" &&
        value==="fail"
    ){

        return finalState(
            "🔴",
            "NO TRADE",
            "M1 TRIGGER INVALID",
            "Execution Trigger وجود ندارد."
        );

    }


    if(
        step.id==="riskfinal" &&
        value!=="pass"
    ){

        return finalState(
            "🔴",
            "NO TRADE",
            "RISK INVALID",
            "Risk یا Invalidation Point معتبر نیست."
        );

    }


    if(
        step.id==="target" &&
        value!=="pass"
    ){

        return finalState(
            "🔴",
            "NO TRADE",
            "TARGET SPACE INSUFFICIENT",
            "فضای کافی تا Target وجود ندارد."
        );

    }


    current++;


    if(current >= steps.length){

        evaluateFinal();

    }else{

        render();

    }

}


/* =========================================================
   BACK
   ========================================================= */

function back(){

    if(history.length===0){

        return;

    }

    current = history.pop();

    render();

}


/* =========================================================
   FINAL EVALUATION
   ========================================================= */

function evaluateFinal(){

    const engine =
        mode==="day"
        ? "V3.6.9"
        : "V5";


    const engineReady =
        answers.setup==="yes" &&
        answers.m15==="pass" &&
        answers.m5==="pass" &&
        answers.m1==="pass" &&
        answers.riskfinal==="pass" &&
        answers.target==="pass";


    if(!engineReady){

        return finalState(
            "🔴",
            "NO TRADE",
            engine,
            "تمام شروط Entry Gate به‌صورت کامل تأیید نشده‌اند."
        );

    }


    if(mode==="day"){

        return finalState(
            "🟢",
            "V3.6.9 ENTRY READY",
            "STRUCTURAL SNIPER",
            "Context + Liquidity + Confirmation + M5 Structure + M1 Trigger + Risk + Target Space تأیید شده است."
        );

    }


    return finalState(
        "🟢",
        "V5 SUPER SCALP ENTRY READY",
        "SUPER SCALP",
        "M15 Event + M5 MSS/Displacement + M1 Trigger + HTF Liquidity Rule + Risk تأیید شده است."
    );

}


/* =========================================================
   FINAL SCREEN
   ========================================================= */

function finalState(
    icon,
    title,
    subtitle,
    text
){

    document.getElementById("progressBar").style.width="100%";


    const modeLabel =
        mode==="day"
        ? "🦅 DAY TRADE — V3.6.9"
        : mode==="scalp"
        ? "⚡ SUPER SCALP — V5"
        : "🦅 SNIPER GOD'S PLAN";


    document.getElementById("app").innerHTML = `

        <div class="card state">

            <div class="mode-selected">

                <span class="${
                    mode==="day"
                    ? "mode-day"
                    : "mode-scalp"
                }">

                    ${modeLabel}

                </span>

            </div>


            <div class="icon">
                ${icon}
            </div>


            <h2>
                ${title}
            </h2>


            <div class="phase">
                ${subtitle}
            </div>


            <p class="${
                title.includes("NO TRADE")
                ? "red"
                : title.includes("WAIT")
                ? "yellow"
                : title.includes("DUAL")
                ? "orange"
                : "green"
            }">

                ${text}

            </p>


            <div class="summary">

                <div class="stat">
                    <b>${answers.trades || "—"}</b>
                    <small>Daily Trades</small>
                </div>

                <div class="stat">
                    <b>${answers.h4 || "—"}</b>
                    <small>H4 State</small>
                </div>

                <div class="stat">
                    <b>${answers.h1 || "—"}</b>
                    <small>H1 State</small>
                </div>

            </div>


            <div class="footer-actions">

                <button
                    class="primary"
                    onclick="restart()">

                    🔄 بررسی جدید

                </button>

            </div>

        </div>


        <div class="card">

            <div class="phase">
                🔒 MASTER NO-TRADE ENGINE
            </div>

            <div class="hint">

                No Context → No Trade
                <br>

                No Location → No Trade
                <br>

                No Liquidity Reaction → No Trade
                <br>

                No Confirmation → No Trade
                <br>

                No Target Space → No Trade
                <br>

                No Risk Validity → No Trade
                <br>

                No Setup → No Trade

            </div>

        </div>

    `;

}


/* =========================================================
   RESTART
   ========================================================= */

function restart(){

    mode=null;

    current=0;

    history=[];

    answers={};

    renderModeSelector();

}


/* =========================================================
   START
   ========================================================= */

renderModeSelector();

</script>
