<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>SNIPER GOD'S PLAN 3.6.9</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#080b12;
    color:#f1f5f9;
    font-family:Arial,Tahoma,sans-serif;
}

.container{
    width:min(900px,94%);
    margin:30px auto;
}

.header{
    text-align:center;
    padding:25px 15px;
    border:1px solid #263244;
    border-radius:20px;
    background:linear-gradient(145deg,#101722,#080b12);
    box-shadow:0 10px 35px rgba(0,0,0,.35);
}

.header h1{
    margin:0;
    font-size:27px;
}

.header p{
    color:#94a3b8;
    margin:10px 0 0;
}

.mode-screen{
    margin-top:25px;
}

.question{
    margin-top:20px;
    padding:24px;
    border:1px solid #263244;
    border-radius:18px;
    background:#0e141e;
}

.question h2{
    margin-top:0;
    font-size:21px;
}

.question p{
    color:#aab5c5;
    line-height:1.8;
}

.buttons{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:15px;
    margin-top:20px;
}

button{
    border:1px solid #334155;
    background:#111827;
    color:#fff;
    padding:17px;
    border-radius:14px;
    cursor:pointer;
    font-size:16px;
    transition:.2s;
}

button:hover{
    transform:translateY(-2px);
    border-color:#64748b;
    background:#182131;
}

.mode-btn{
    min-height:145px;
}

.mode-btn .icon{
    display:block;
    font-size:35px;
    margin-bottom:12px;
}

.mode-btn small{
    display:block;
    margin-top:8px;
    color:#94a3b8;
}

.back{
    margin-top:15px;
    background:#171d29;
}

.hidden{
    display:none!important;
}

.status{
    margin-top:18px;
    padding:15px;
    border-radius:14px;
    background:#0b111a;
    border:1px solid #263244;
}

.status strong{
    display:block;
    margin-bottom:7px;
}

.step{
    margin-top:18px;
    color:#94a3b8;
    font-size:14px;
}

.answer-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:12px;
    margin-top:18px;
}

.answer{
    min-height:62px;
}

.green{
    border-color:#166534;
}

.red{
    border-color:#7f1d1d;
}

.yellow{
    border-color:#854d0e;
}

.final{
    text-align:center;
    padding:30px 20px;
    margin-top:20px;
    border-radius:18px;
    border:1px solid #334155;
    background:#0d131d;
}

.final h2{
    margin-top:0;
}

.ready{
    color:#4ade80;
}

.wait{
    color:#facc15;
}

.no{
    color:#f87171;
}

.info{
    margin-top:15px;
    color:#94a3b8;
    line-height:1.8;
}

@media(max-width:650px){
    .buttons,
    .answer-grid{
        grid-template-columns:1fr;
    }

    .header h1{
        font-size:23px;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>🦅 SNIPER GOD'S PLAN</h1>
        <p>V3.6.9 + V5 SUPER SCALP</p>
    </div>


    <!-- =========================
         MODE SELECTOR
    ========================== -->

    <div id="modeScreen" class="mode-screen">

        <div class="question">

            <h2>ابتدا نوع معامله را انتخاب کن</h2>

            <p>
                قبل از ورود به سیستم مشخص کن امروز می‌خواهی
                <b>Super Scalp</b> انجام بدهی یا
                <b>Day Trade</b>.
            </p>

            <div class="buttons">

                <button class="mode-btn" onclick="startSuperScalp()">
                    <span class="icon">⚡</span>
                    <b>SUPER SCALP</b>
                    <small>V5 — Live Decision Engine</small>
                </button>

                <button class="mode-btn" onclick="startDayTrade()">
                    <span class="icon">🦅</span>
                    <b>DAY TRADE</b>
                    <small>V3.6.9 — Structural Sniper</small>
                </button>

            </div>

        </div>

    </div>


    <!-- =========================
         ASSISTANT
    ========================== -->

    <div id="assistant" class="hidden">

        <div class="status">

            <strong id="modeTitle"></strong>

            <span id="modeDescription"></span>

        </div>

        <div id="stepCounter" class="step"></div>

        <div id="questionBox"></div>

    </div>

</div>


<script>

/* =========================================================
   MASTER STATE
========================================================= */

let mode = null;

let step = 0;

let state = {};

const MAX_TRADES = 3;
const MAX_CONSECUTIVE_LOSSES = 2;


/* =========================================================
   MODE SELECT
========================================================= */

function startSuperScalp(){

    mode = "V5";

    step = 0;

    state = {};

    document.getElementById("modeScreen").classList.add("hidden");

    document.getElementById("assistant").classList.remove("hidden");

    document.getElementById("modeTitle").innerHTML =
        "⚡ V5 SUPER SCALP — ACTIVE";

    document.getElementById("modeDescription").innerHTML =
        "Live Decision Engine — تصمیم‌گیری سریع برای حرکت‌های کوتاه.";

    renderV5();

}


function startDayTrade(){

    mode = "V369";

    step = 0;

    state = {};

    document.getElementById("modeScreen").classList.add("hidden");

    document.getElementById("assistant").classList.remove("hidden");

    document.getElementById("modeTitle").innerHTML =
        "🦅 V3.6.9 DAY TRADE — ACTIVE";

    document.getElementById("modeDescription").innerHTML =
        "Structural Sniper — Context → Structure → Liquidity → Entry.";

    renderV369();

}


/* =========================================================
   COMMON UI
========================================================= */

function question(title,text,buttons){

    let html = `
        <div class="question">

            <h2>${title}</h2>

            <p>${text}</p>

            <div class="answer-grid">
    `;

    buttons.forEach(b => {

        html += `
            <button
                class="answer ${b.class || ""}"
                onclick="${b.action}">
                ${b.text}
            </button>
        `;

    });

    html += `
            </div>

            <button class="back" onclick="goBack()">
                ← بازگشت
            </button>

        </div>
    `;

    document.getElementById("questionBox").innerHTML = html;

    document.getElementById("stepCounter").innerText =
        "STEP " + (step + 1);

}


/* =========================================================
   V5 SUPER SCALP
========================================================= */

/*
    IMPORTANT:

    V5 deliberately does NOT run:

    Monthly
    Weekly
    Daily
    H4
    H1
    HTF Hard Filter
    M5 mandatory confirmation

    This is a separate Live Opportunity Engine.
*/


function renderV5(){

    switch(step){

        case 0:

            question(
                "STEP 1 — معاملات امروز",
                "امروز چند معامله انجام داده‌ای؟",
                [
                    {
                        text:"0 معامله",
                        action:"v5Daily(0)"
                    },
                    {
                        text:"1 معامله",
                        action:"v5Daily(1)"
                    },
                    {
                        text:"2 معامله",
                        action:"v5Daily(2)"
                    },
                    {
                        text:"3 معامله",
                        class:"red",
                        action:"noTrade('🔴 TRADING DAY CLOSED')"
                    }
                ]
            );

        break;


        case 1:

            question(
                "STEP 2 — وضعیت Loss",
                "آیا امروز دو معامله متوالی با ضرر بسته شده‌اند؟",
                [
                    {
                        text:"خیر",
                        class:"green",
                        action:"v5Loss(false)"
                    },
                    {
                        text:"بله",
                        class:"red",
                        action:"noTrade('🔴 STOP FOR THE DAY — 2 CONSECUTIVE LOSSES')"
                    }
                ]
            );

        break;


        case 2:

            question(
                "STEP 3 — M15 Market Condition",
                "در M15 شرایط فعلی بازار چیست؟",
                [
                    {
                        text:"حرکت / Expansion",
                        action:"v5M15('expansion')"
                    },
                    {
                        text:"Range Edge",
                        action:"v5M15('range')"
                    },
                    {
                        text:"Correction / Pullback",
                        action:"v5M15('correction')"
                    },
                    {
                        text:"نامشخص / Chop",
                        class:"red",
                        action:"noTrade('🔴 NO TRADE — M15 CONDITION UNCLEAR')"
                    }
                ]
            );

        break;


        case 3:

            question(
                "STEP 4 — M15 Location",
                "قیمت الان در کدام Location قرار دارد؟",
                [
                    {
                        text:"Liquidity Edge",
                        action:"v5Location(true)"
                    },
                    {
                        text:"Range High / Low",
                        action:"v5Location(true)"
                    },
                    {
                        text:"Supply / Demand",
                        action:"v5Location(true)"
                    },
                    {
                        text:"Reclaimed Level",
                        action:"v5Location(true)"
                    },
                    {
                        text:"وسط Range / EQ",
                        class:"red",
                        action:"noTrade('🔴 NO TRADE — BAD LOCATION / RANGE MIDDLE')"
                    }
                ]
            );

        break;


        case 4:

            question(
                "STEP 5 — Liquidity Event",
                "در لحظه چه Liquidity Event در M15 اتفاق افتاده؟",
                [
                    {
                        text:"Sweep",
                        action:"v5Liquidity(true)"
                    },
                    {
                        text:"Reclaim",
                        action:"v5Liquidity(true)"
                    },
                    {
                        text:"Breakout",
                        action:"v5Liquidity(true)"
                    },
                    {
                        text:"Fake Breakout",
                        action:"v5Liquidity(true)"
                    },
                    {
                        text:"هیچ Event معتبری نیست",
                        class:"red",
                        action:"noTrade('🔴 NO TRADE — NO VALID LIQUIDITY EVENT')"
                    }
                ]
            );

        break;


        case 5:

            question(
                "STEP 6 — M1 Confirmation",
                "آیا M1 تأیید قابل معامله ایجاد کرده است؟",
                [
                    {
                        text:"Micro Sweep → MSS → Displacement",
                        action:"v5Confirmation(true)"
                    },
                    {
                        text:"Break → Retest → Trigger",
                        action:"v5Confirmation(true)"
                    },
                    {
                        text:"Sweep → Reclaim → Trigger",
                        action:"v5Confirmation(true)"
                    },
                    {
                        text:"هنوز تأیید نشده",
                        class:"yellow",
                        action:"waitTrade('🟡 WAIT — M1 SETUP DEVELOPING')"
                    }
                ]
            );

        break;


        case 6:

            question(
                "STEP 7 — Risk / SL",
                "آیا Invalidation Point مشخص است و SL می‌تواند پشت آن قرار بگیرد؟",
                [
                    {
                        text:"بله — SL منطقی است",
                        action:"v5SL(true)"
                    },
                    {
                        text:"خیر — SL نامشخص",
                        class:"red",
                        action:"noTrade('🔴 NO TRADE — INVALID STOP LOSS')"
                    }
                ]
            );

        break;


        case 7:

            question(
                "STEP 8 — Target Space",
                "آیا تا Target انتخاب‌شده فضای کافی برای معامله وجود دارد؟",
                [
                    {
                        text:"بله",
                        class:"green",
                        action:"v5Target(true)"
                    },
                    {
                        text:"خیر",
                        class:"red",
                        action:"noTrade('🔴 NO TRADE — INSUFFICIENT TARGET SPACE')"
                    }
                ]
            );

        break;


        case 8:

            entryReady(
                "⚡ V5 SUPER SCALP ENTRY READY",
                "تمام Gates لازم برای ورود Super Scalp عبور کرده‌اند."
            );

        break;

    }

}


/* =========================================================
   V5 ACTIONS
========================================================= */

function v5Daily(value){

    state.trades=value;

    step=1;

    renderV5();

}


function v5Loss(value){

    state.loss=value;

    step=2;

    renderV5();

}


function v5M15(value){

    state.m15=value;

    step=3;

    renderV5();

}


function v5Location(value){

    state.location=value;

    step=4;

    renderV5();

}

    state.liquidity=value;

}

}

}

/* =========================================================
   FINAL STATES
========================================================= */

function entryReady(title,message){

    document.getElementById("stepCounter").innerText =
        "FINAL ENTRY GATE";

    document.getElementById("questionBox").innerHTML = `

        <div class="final">

            <h2 class="ready">${title}</h2>

            <div class="info">
                ${message}
            </div>

            <div class="info">
                ✅ Risk Valid<br>
                ✅ SL Defined<br>
                ✅ Target Defined<br>
                ✅ Target Space Valid
            </div>

            <button onclick="resetSystem()">

            </button>

    `;

}


function waitTrade(message){

    document.getElementById("stepCounter").innerText =
        "WAIT STATE";

    document.getElementById("questionBox").innerHTML = `

}

    document.getElementById("stepCounter").innerText =
        "NO TRADE";

    document.getElementById("questionBox").innerHTML = `

        <div class="final">

            <h2 class="no">🔴 NO TRADE</h2>

            <div class="info">
                ${message}
            </div>

            <button onclick="resetSystem()">
                شروع تحلیل جدید
            </button>

        </div>

    `;

}


/* =========================================================
   NAVIGATION
========================================================= */

function continueCurrent(){

    if(mode==="V5"){
        renderV5();
    }

    if(mode==="V369"){
        renderV369();
    }

}


function goBack(){

    if(step>0){

        step--;

        if(mode==="V5"){
            renderV5();
        }

        if(mode==="V369"){
            renderV369();
        }

    }else{

        resetSystem();

    }

}


function resetSystem(){

    mode=null;

    step=0;

    state={};

    document.getElementById("assistant")
        .classList.add("hidden");

    document.getElementById("modeScreen")
        .classList.remove("hidden");

    document.getElementById("questionBox").innerHTML="";

}

</script>
