<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>SNIPER GOD'S PLAN — V3.6.9 + V5 SUPER SCALP</title>

<style>
*{box-sizing:border-box}
body{
    margin:0;
    background:#080b10;
    color:#e8edf5;
    font-family:Arial,Tahoma,sans-serif;
}
.app{
    max-width:900px;
    margin:auto;
    min-height:100vh;
    padding:18px;
}
.header{
    border:1px solid #26303d;
    border-radius:18px;
    padding:20px;
    background:linear-gradient(145deg,#101722,#090d13);
    box-shadow:0 10px 35px rgba(0,0,0,.35);
    margin-bottom:16px;
}
.logo{
    font-size:26px;
    font-weight:900;
    letter-spacing:.5px;
}
.sub{
    margin-top:6px;
    color:#8e9aaa;
    font-size:13px;
}
.engine-bar{
    display:flex;
    gap:8px;
    margin-top:15px;
    flex-wrap:wrap;
}
.badge{
    padding:7px 11px;
    border-radius:999px;
    font-size:12px;
    font-weight:bold;
    border:1px solid #303b4a;
}
.badge.a{color:#9ec7ff;background:#101b2a}
.badge.b{color:#ffd77a;background:#211b0d}
.badge.r{color:#ff8d8d;background:#241113}

.card{
    background:#0d131b;
    border:1px solid #222c38;
    border-radius:18px;
    padding:18px;
    margin-bottom:14px;
}
.phase{
    color:#7faef4;
    font-size:12px;
    font-weight:bold;
    margin-bottom:7px;
}
h2{
    margin:0 0 10px;
    font-size:20px;
}
.question{
    font-size:18px;
    font-weight:bold;
    line-height:1.7;
}
.hint{
    color:#8995a6;
    font-size:13px;
    line-height:1.7;
    margin-top:7px;
}
.options{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:9px;
    margin-top:15px;
}
button{
    border:1px solid #303b49;
    background:#111923;
    color:#e8edf5;
    border-radius:12px;
    padding:13px;
    cursor:pointer;
    font-weight:bold;
    font-size:14px;
    transition:.15s;
}
button:hover{
    border-color:#6389bd;
    transform:translateY(-1px);
}
button.primary{
    background:#18283d;
    border-color:#527eb7;
}
button.good{
    background:#102419;
    border-color:#2c7547;
    color:#8ce0a8;
}
button.warn{
    background:#241e0d;
    border-color:#8c6a20;
    color:#f3d277;
}
button.bad{
    background:#271215;
    border-color:#77323a;
    color:#ff9ca2;
}
button.back{
    background:#10151d;
    color:#aeb8c7;
}
.footer-actions{
    display:flex;
    gap:8px;
    margin-top:14px;
}
.footer-actions button{
    flex:1;
}
.progress{
    height:5px;
    background:#151c25;
    border-radius:10px;
    overflow:hidden;
    margin-top:13px;
}
.progress span{
    display:block;
    height:100%;
    background:#668fc7;
    width:0%;
    transition:.25s;
}
.state{
    text-align:center;
    padding:22px 12px;
}
.state .icon{
    font-size:42px;
    margin-bottom:8px;
}
.state h2{
    font-size:24px;
}
.green{color:#78e29a}
.yellow{color:#f1cd6a}
.red{color:#ff858d}
.blue{color:#82b5ff}
.orange{color:#ffb36a}

.summary{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:8px;
    margin-top:12px;
}
.stat{
    padding:11px;
    border:1px solid #242e3a;
    border-radius:11px;
    background:#0a1017;
    text-align:center;
}
.stat b{
    display:block;
    font-size:18px;
}
.stat small{
    color:#8490a0;
}
.timeline{
    border-right:2px solid #273443;
    padding-right:14px;
    margin-top:10px;
}
.node{
    margin:0 0 13px;
    position:relative;
}
.node:before{
    content:"";
    position:absolute;
    right:-21px;
    top:5px;
    width:9px;
    height:9px;
    border-radius:50%;
    background:#547eb4;
}
.node strong{
    display:block;
}
.node span{
    color:#8592a3;
    font-size:12px;
}
input,select{
    width:100%;
    padding:12px;
    margin-top:8px;
    border-radius:10px;
    border:1px solid #303b49;
    background:#090e14;
    color:#fff;
    font-size:14px;
}
@media(max-width:600px){
    .options{grid-template-columns:1fr}
    .summary{grid-template-columns:1fr 1fr}
}
</style>
</head>

</header>

</div>

    options:[

    options:[

    options:[

        ["Breakout → Retest → Hold","ok","m3"],

},

    options:[

},

{

    hint:"M1 فقط Execution Trigger است.",
    options:[
        ["Break → Retest → Trigger","ok","pass"],

        ["M1 Displacement","ok","pass"],
        ["Micro Sweep → Reclaim → Trigger","ok","pass"],

/* =========================
   V5
   ========================= */

    hint:"Liquidity / Session Event / Range Edge / Sweep / Reclaim / Short-Term Expansion.",
    options:[

/* =========================
   ENTRY GATE
   ========================= */

    options:[

let current = 0;
let history = [];
let answers = {};

function render(){

    const step = steps[current];

    document.getElementById("progressBar").style.width =
        ((current)/(steps.length-1))*100 + "%";

    let html = `
    <div class="card">
        <div class="phase">${step.phase}</div>
        <div class="question">${step.title}</div>
        <div class="hint">${step.hint}</div>

        <div class="options">
    `;

    step.options.forEach((o,i)=>{
        html += `
        <button class="${o[1]}" onclick="answer('${o[2]}')">
            ${o[0]}
        </button>`;
    });

    html += `</div>`;

    if(current>0){
        html += `
        <div class="footer-actions">
            <button class="back" onclick="back()">← مرحله قبل</button>
        </div>`;
    }

    html += `</div>`;

    html += `
    <div class="card">
        <div class="phase">CURRENT STATE</div>
        <div class="timeline">
            <div class="node">
                <strong>Context</strong>
                <span>Monthly → Weekly → Daily → H4 → H1</span>
            </div>
            <div class="node">
                <strong>Liquidity</strong>
                <span>HTF → Session → Lower TF</span>
            </div>
            <div class="node">
                <strong>HTF Reaction</strong>
                <span>Acceptance / Sweep & Reversal</span>
            </div>
            <div class="node">
                <strong>Opportunity Engines</strong>
                <span>V3.6.9 + V5</span>
            </div>
        </div>
    </div>
    `;

    document.getElementById("app").innerHTML = html;
}

function answer(value){

    answers[steps[current].id] = value;
    history.push(current);

    /* HARD STOPS */

    if(steps[current].id==="trades" && value==="closed"){
        return finalState(
            "🔴",
            "NO TRADE",
            "3 Trades Completed — Trading Day Closed",
            "حداکثر Daily Trades تکمیل شده است."
        );
    }

    if(steps[current].id==="risk" && value==="stop"){
        return finalState(
            "🔴",
            "NO TRADE",
            "2 Consecutive Losses — STOP FOR THE DAY",
            "هیچ‌کدام از دو موتور اجازه Entry ندارند."
        );
    }

    if(steps[current].id==="h4" && value==="transition"){
        return finalState(
            "🔴",
            "NO TRADE",
            "H4 TRANSITION",
            "H4 Context هنوز تأیید نشده است."
        );
    }

    if(steps[current].id==="h1" && value==="unclear"){
        return finalState(
            "🔴",
            "NO TRADE",
            "H1 STRUCTURE UNCLEAR",
            "Context کافی برای ادامه وجود ندارد."
        );
    }

    if(steps[current].id==="liquidity" && value==="unclear"){
        return finalState(
            "🔴",
            "NO TRADE",
            "LIQUIDITY UNCLEAR",
            "Liquidity Map قابل اعتماد نیست."
        );
    }

    if(steps[current].id==="pool" && value==="pending"){
        return finalState(
            "🟡",
            "WAIT — HTF LIQUIDITY REACTION PENDING",
            "No Entry",
            "تا Break & Acceptance یا Sweep & Reversal مشخص نشود، Entry ممنوع است."
        );
    }

    if(steps[current].id==="reaction" &&
       (value==="pending" || value==="invalid")){
        return finalState(
            value==="pending" ? "🟡":"🔴",
            value==="pending" ?
            "WAIT — SETUP DEVELOPING" :
            "NO TRADE",
            "HTF Liquidity Reaction",
            "Liquidity هنوز تعیین تکلیف نشده است."
        );
    }

    if(steps[current].id==="location" &&
       (value==="middle" || value==="weak")){
        return finalState(
            "🔴",
            "NO TRADE",
            "BAD LOCATION",
            "Range Middle / EQ یا Location ضعیف."
        );
    }

    if(steps[current].id==="reclaim" &&
       (value==="incomplete" || value==="wick")){
        return finalState(
            "🟡",
            "WAIT — RECLAIM INCOMPLETE",
            "Wick ≠ Reclaim",
            "Reclaim معتبر نیازمند Valid Close و Hold / Reaction است."
        );
    }

    if(steps[current].id==="ctl" && value==="invalid"){
        return finalState(
            "🔴",
            "NO TRADE",
            "INVALID COUNTER-TREND",
            "Counter-Trend شرایط لازم را ندارد."
        );
    }

    current++;

    if(current >= steps.length){
        evaluateFinal();
    }else{
        render();
    }
}

function back(){

    if(history.length===0) return;

    current = history.pop();

    render();
}

function evaluateFinal(){

    const v3 = answers.v3;
    const v5 = answers.v5;

    const v3Ready =
        v3==="yes" &&
        ["m1","m2","m3","m4"].includes(answers.v3m15) &&
        answers.v3m5==="pass" &&
        answers.v3m1==="pass";

    const v5Ready =
        v5==="yes" &&
        answers.v5m15==="pass" &&
        answers.v5m5==="pass" &&
        answers.v5m1==="pass";

    if(answers.riskfinal!=="pass"){
        return finalState(
            "🔴",
            "NO TRADE",
            "RISK INVALID",
            "Risk یا Invalidation Point معتبر نیست."
        );
    }

    if(answers.target!=="pass"){
        return finalState(
            "🔴",
            "NO TRADE",
            "TARGET SPACE INSUFFICIENT",
            "فضای کافی تا Target وجود ندارد."
        );
    }

    if(v3Ready && v5Ready){
        return finalState(
            "🔥",
            "DUAL OPPORTUNITY",
            "V3.6.9 + V5 SUPER SCALP",
            "هر دو موتور Entry معتبر دارند و Risk Engine مشترک اعمال می‌شود."
        );
    }

    if(v3Ready){
        return finalState(
            "🟢",
            "V3.6.9 ENTRY READY",
            "STRUCTURAL SNIPER",
            "تمام Gates اصلی V3.6.9 عبور کرده‌اند."
        );
    }

    if(v5Ready){
        return finalState(
            "🟢",
            "V5 SUPER SCALP ENTRY READY",
            "SHORT-TERM OPPORTUNITY",
            "تمام Gates اصلی V5 عبور کرده‌اند."
        );
    }

    return finalState(
        "🟡",
        "WAIT — SETUP DEVELOPING",
        "No Valid Entry Yet",
        "هیچ‌کدام از دو موتور هنوز Entry کامل و معتبر ندارند."
    );
}

function finalState(icon,title,subtitle,text){

    document.getElementById("progressBar").style.width="100%";

    document.getElementById("app").innerHTML = `
        <div class="card state">

            <div class="icon">${icon}</div>

            <h2>${title}</h2>

            <div class="phase">${subtitle}</div>

            <p class="${title.includes("NO TRADE") ? "red" :
                       title.includes("WAIT") ? "yellow" :
                       title.includes("DUAL") ? "orange" :
                       "green"}">
                ${text}
            </p>

            <div class="summary">

                <div class="stat">
                    <b>${answers.trades || "—"}</b>
                    <small>Daily Trades</small>
                </div>

                <div class="stat">
                    <b>${answers.h4 || "—"}</b>
                    <small>H4 State</small>
                </div>

                <div class="stat">
                    <b>${answers.h1 || "—"}</b>
                    <small>H1 State</small>
                </div>

            </div>

            <div class="footer-actions">
                <button class="primary" onclick="restart()">
                    🔄 بررسی جدید
                </button>
            </div>

        </div>

        <div class="card">
            <div class="phase">MASTER PRINCIPLE</div>
            <div class="hint">
                No Context → No Trade<br>
                No Location → No Trade<br>
                No Liquidity Reaction → No Trade<br>
                No Confirmation → No Trade<br>
                No Target Space → No Trade<br>
                No Risk Validity → No Trade<br>
                No Setup → No Trade
            </div>
        </div>
    `;
}

function restart(){
    current=0;
    history=[];
    answers={};
    render();
}

render();

</script>

</body>
</html>
